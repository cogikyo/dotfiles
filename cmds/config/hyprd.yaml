# ╭───────────────────────────────────────────────────────────────────────────────╮
# │ window-management tuning                                                      │
# ╰───────────────────────────────────────────────────────────────────────────────╯
windows:
  split:
    xs: "0.3709"
    default: "0.4934"
    lg: "0.7680"
  gaps_out:
    normal: [85, 86, 30, 126]
    share: [20, 20, 16, 22]
  monocle:
    width: 2880
    height: 1864
    offset_x: 0
    offset_y: 25

# ╭───────────────────────────────────────────────────────────────────────────────╮
# │ session catalog                                                               │
# ╰───────────────────────────────────────────────────────────────────────────────╯
sessions:
  # ├─ workspace 2 ──────────────────────────────────────────────────────────────┤
  2: # communication-focused sessions.
    slack:
      command: slack
      monocle: true
      init: true

    discord:
      command: discord
      monocle: true

  # ├─ workspace 3 ──────────────────────────────────────────────────────────────┤
  3: # alternate main workspace
    leadpier-alt:
      project: LeadPier
      body:
        - editor
        - agents
      tabs:
        editor: leadpier
        agents: agents-all

    type:
      command: chromium --new-window https://vial.rocks/
      class: chromium
      browser: type

    tableplus:
      command: tableplus
    inkscape:
      command: inkscape
    obs:
      command: sh -c 'obs & exec kitty --title=obs-recordings --directory ~/media/recordings --session ~/.config/kitty/sessions/recordings.conf'
      class: kitty

    harpoon:
      project: cogikyo/harpoon
      body:
        - editor
        - agents

    vagari.nvim:
      project: vagari/nvim
      body:
        - editor
        - agents

    vagari.firefox:
      project: vagari/firefox
      body:
        - editor
        - agents

    cogikyo:
      project: cogikyo/cogikyo
      body:
        - editor
        - agents

  # ├─ workspace 4 ──────────────────────────────────────────────────────────────┤
  4: # primary project workspaces
    content:
      project: content
      body:
        - editor
        - agents

    # cogikyo:
    #   project: cogikyo/cogikyo
    #   body:
    #     - editor
    #     - agents

    alrodriguez.studio:
      project: cogikyo/alrodriguez.studio
      body:
        - editor
        - agents

    leadpier:
      init: true
      project: LeadPier
      body:
        - editor
        - browser
        - agents
      layout:
        master: editor
        slave: browser
        shadow: agents
      browser: leadpier
      tabs:
        editor: leadpier
        agents: agents-all

  # ├─ workspace 5 ──────────────────────────────────────────────────────────────┤
  5: # personal infrastructure and dotfiles work.
    dotfiles:
      init: true
      project: dotfiles
      body:
        - editor
        - agents


# ╭───────────────────────────────────────────────────────────────────────────────╮
# │ kitty tab profiles                                                            │
# ╰───────────────────────────────────────────────────────────────────────────────╯
tabs:
  editor: # ├─ editor profile ────────────────────────────────────────────────────┤
    order: 0
    prefix: "ed-"
    focus: nvim
    tabs:
      - { name: xplr,  title: "⟜ 󰭎  ⊸", command: xplr, executables: [xplr] }
      - { name: nvim,  title: "⟜   ⊸", command: nvim, executables: [nvim] }
      - { name: term,  title: "⟜   ⊸", command: "etree 1", executables: [erd, head] }
      - { name: build, title: "⟜   ⊸", command: "etree 2", executables: [erd, head] }
      - { name: git,   title: "⟜   ⊸", command: lazygit, requires: git, executables: [git, lazygit] }

  agents: # ├─ agents profile ─────────────────────────────────────────────────────┤
    order: 1
    prefix: "agents-"
    focus: build
    tabs:
      - { name: scout, title: "⊰   ⊱", executables: [opencode] }
      - { name: build, title: "⊰ 󰯉  ⊱", command: c, executables: [opencode] }
      - { name: drive, title: "⊰   ⊱", executables: [opencode] }
      - name: plan
        title: "⊰   ⊱"
        executables: [opencode]
        actions:
          build: {}
      - { name: learn, title: "⊰   ⊱", executables: [opencode] }

  agents-all: # ├─ all-agents profile ────────────────────────────────────────────────┤
    order: 1
    prefix: "agents-"
    focus: build
    tabs:
      - { name: scout, title: "⊰   ⊱", command: c, executables: [opencode] }
      - { name: build, title: "⊰ 󰯉  ⊱", command: c, executables: [opencode] }
      - { name: drive, title: "⊰   ⊱", command: c, executables: [opencode] }
      - name: plan
        title: "⊰   ⊱"
        command: c
        executables: [opencode]
        actions:
          build: {}
      - { name: learn, title: "⊰   ⊱", command: c, executables: [opencode] }

  leadpier: # ├─ leadpier profile ─────────────────────────────────────────────────┤
    order: 2
    prefix: "lp-"
    focus: frontend
    tabs:
      - name: frontend
        title: "«   »"
        command: nvim
        executables: [nvim]
        cwd: "~/LeadPier/frontend"
        actions:
          nvim: {}
      - name: services
        title: "«   »"
        command: nvim
        executables: [nvim]
        cwd: "~/LeadPier/backend/services"
        actions:
          nvim: {}
      - name: term
        title: "« 󰠳  »"
        cwd: "~/LeadPier"
        actions:
          term: {}
        layout: "fat:bias=50"
        panes:
          - cwd: "~/LeadPier"
      - name: backend
        title: "«   »"
        command: nvim
        executables: [nvim]
        cwd: "~/LeadPier/backend"
        actions:
          nvim:
            pane: 0
          term:
            pane: 1
        layout: "fat:bias=80"
        panes:
          - command: ""
            cwd: "~/LeadPier/frontend"
      - name: pier
        title: "«   »"
        command: nvim
        executables: [nvim]
        cwd: "~/LeadPier/pier"
        actions:
          nvim:
            pane: 0
          term:
            pane: 1
        layout: "fat:bias=80"
        panes:
          - command: ""
            cwd: "~/LeadPier"

# ╭───────────────────────────────────────────────────────────────────────────────╮
# │ background                                                                    │
# ╰───────────────────────────────────────────────────────────────────────────────╯
background:
  enabled: false
  display: "auto"
  video_path: "~/dotfiles/share/videos"
  socket: "/tmp/mpvpaper.sock"
  wallpaper:
    file: "dna.mp4"
    brightness: 6
    contrast: 9
    saturation: -16
    hue: -24

# ╭───────────────────────────────────────────────────────────────────────────────╮
# │ init                                                                          │
# ╰───────────────────────────────────────────────────────────────────────────────╯
init:
  workspace: 1
  lock: true
  network_timeout: 10

# ╭───────────────────────────────────────────────────────────────────────────────╮
# │ bluetooth                                                                     │
# ╰───────────────────────────────────────────────────────────────────────────────╯
bluetooth:
  enabled: true
  device: "70:F9:4A:C0:E5:2E"

# ╭───────────────────────────────────────────────────────────────────────────────╮
# │ vpn                                                                           │
# ╰───────────────────────────────────────────────────────────────────────────────╯
vpn:
  connections:
    Trend:
      profile: ~/.local/share/dotfiles/vpn/work.nmconnection

# ╭───────────────────────────────────────────────────────────────────────────────╮
# │ notifications                                                                 │
# ╰───────────────────────────────────────────────────────────────────────────────╯
notify:
  default_volume: 100 # percentage; 100 = paplay 65536. Per-event volume overrides this.

  # ├─ visual styles ────────────────────────────────────────────────────────────┤
  styles:
    primary:
      background: "#49353130"
      foreground: "#f2a170"
      frame: "#ea834b"
    secondary:
      background: "#25284180"
      foreground: "#8aa4f3"
      frame: "#6380ec80"
    tertiary:
      background: "#2a2d4580"
      foreground: "#b29ae8"
      frame: "#9376d880"
    success:
      background: "#2a3d2580"
      foreground: "#95cb79"
      frame: "#73ad5a80"
    error:
      background: "#49313130"
      foreground: "#f34658"
      frame: "#ea4b53"

  # ├─ agent events ─────────────────────────────────────────────────────────────┤
  # Persistent = timeout 0. Urgency derived: critical if timeout > 0, normal otherwise.
  agent_events:
    start:
      style: secondary
      sound: civ5-worker-select
      volume: 95
      timeout: 1000
    idle:
      style: secondary
      sound: sdv-frog
      volume: 95
      timeout: 5000

    subagent:
      style: success
      sound: sdv-collect-item
      volume: 65
      timeout: 2500
    todo-complete:
      style: success
      sound: civ6-notification
      volume: 65
      timeout: 2500

    complete:
      style: primary
      sound: jobs-done
      volume: 110

    permission:
      style: tertiary
      sound: ssb-ready
    question:
      style: tertiary
      sound: hey-listen

    error:
      style: error
      sound: something-need-doing
      timeout: 2500
      volume: 100

  # ├─ sound routing ────────────────────────────────────────────────────────────┤
  urgency_sounds: # common urgency levels
    low: none
    normal: moondrop
    critical: gems

  app_sounds: # app-specific sounds override urgency-based sounds when both match.
    timer: jackpot
    attention: discovery
    chat: reward
    work: fruit
    wf-start: discovery
    wf-end: reward

  # ├─ activation targets ───────────────────────────────────────────────────────┤
  # Keys match the dunst app name or desktop-entry; class is the live Hyprland class.
  # Apps listed here are focused when their notification is activated (click or Alt+C),
  # even when the sending app offers no action of its own.
  # Routes last only while the latest notification for that target remains active.
  # Repeated notifications for one target coalesce into the newest route.
  action_focus_apps:
    Slack: { workspace: 2, class: slack }
    Firefox: { workspace: 2, class: firefox-developer-edition }
    Firefox Developer Edition: { workspace: 2, class: firefox-developer-edition }
    firefox-developer-edition: { workspace: 2, class: firefox-developer-edition }

  # ├─ silence filters ──────────────────────────────────────────────────────────┤
  silent_apps: # these suppress sounds without suppressing the notification itself.
    - Spotify
    - discord
    - slack
  kitty_silent_patterns: # these silence agent based notications, favoring agent styles instead
    - opencode
    - approval
