# ╭───────────────────────────────────────────────────────────────────────────────╮
# │ display profiles                                                              │
# ╰───────────────────────────────────────────────────────────────────────────────╯
# First match wins; the last profile is the fallback for screens nothing else matches.
displays:
  - name: laptop
    match: { description: "LG Display 0x06B3" }
    eww: compact
    glava: false
    font_size: 11
    split:
      normal: { default: "0.5000", wide: "0.7700" }
      share: { default: "0.5000", wide: "0.7653" }
    gaps_out:
      normal: [52, 10, 10, 10]
      share: [13, 10, 13, 10]
    monocle: { width: 0.75, height: 0.87, offset_x: 0, offset_y: 17 }

  - name: desk
    match: { min_width: 3200, min_ppi: 120 }
    eww: full
    glava: true
    font_size: 15
    split:
      normal: { narrow: "0.4131", default: "0.4749", wide: "0.7683", mobile: "0.8224" }
      share: { narrow: "0.3713", default: "0.5000", wide: "0.7683", mobile: "0.8309" }
    gaps_out:
      normal: [85, 90, 27, 124]
      share: [14, 16, 14, 16]
    monocle: { width: 0.751, height: 0.8685, offset_x: 0, offset_y: 25 }

  - name: tv
    eww: full
    glava: true
    font_size: 17
    split:
      normal: { narrow: "0.4131", default: "0.4749", wide: "0.7683", mobile: "0.8224" }
      share: { narrow: "0.3713", default: "0.5000", wide: "0.7683", mobile: "0.8309" }
    gaps_out:
      normal: [85, 90, 27, 124]
      share: [14, 16, 14, 16]
    monocle: { width: 0.751, height: 0.8685, offset_x: 0, offset_y: 25 }

# ╭───────────────────────────────────────────────────────────────────────────────╮
# │ session catalog                                                               │
# ╰───────────────────────────────────────────────────────────────────────────────╯
sessions:
  # ├─ workspace 1 ──────────────────────────────────────────────────────────────┤
  1: # communication-focused sessions.
    slack:
      command: sh -c 'slack & exec gtk-launch grok-bot'
      layout:
        slave: grok-bot
      init: true

    discord:
      command: discord
      monocle: true

  # ├─ workspace 2 ──────────────────────────────────────────────────────────────┤
  2: # alternate main workspace
    leadpier-alt:
      project: LeadPier
      body:
        - editor
        - agents
      tabs:
        editor: leadpier
        agents: agents-all

    type:
      init: true
      after: leadpier
      command: sh -c 'Vial & exec firefox-developer-edition --new-window https://monkeytype.com/'
      class: Vial
      layout:
        slave: firefox-developer-edition

    inkscape:
      command: inkscape
    obs:
      command: sh -c 'obs & exec kitty --title=obs-recordings --directory ~/media/recordings --session ~/.config/kitty/sessions/recordings.conf'
      class: kitty

    harpoon:
      project: cogikyo/harpoon
      body:
        - editor
        - agents

    vagari.nvim:
      project: vagari/nvim
      body:
        - editor
        - agents

    vagari.firefox:
      project: vagari/firefox
      body:
        - editor
        - agents

  # ├─ workspace 3 ──────────────────────────────────────────────────────────────┤
  3: # work
    leadpier:
      init: true
      project: LeadPier
      body:
        - editor
        - browser
        - agents
      layout:
        master: editor
        slave: browser
        shadow: agents
      browser: leadpier
      tabs:
        editor: leadpier

  # ├─ workspace 4 ──────────────────────────────────────────────────────────────┤
  4: # personal projects
    content:
      project: content
      body:
        - editor
        - agents

    cogikyo:
      init: true
      project: cogikyo/cogikyo
      body:
        - editor
        - agents

  # ├─ workspace 5 ──────────────────────────────────────────────────────────────┤
  5: # personal infrastructure and dotfiles work.
    dotfiles:
      init: true
      project: dotfiles
      body:
        - editor
        - agents


# ╭───────────────────────────────────────────────────────────────────────────────╮
# │ kitty tab profiles                                                            │
# ╰───────────────────────────────────────────────────────────────────────────────╯
tabs:
  editor: # ├─ editor profile ────────────────────────────────────────────────────┤
    order: 0
    prefix: "ed-"
    focus: nvim
    tabs:
      - { name: xplr,  title: "⟜ 󰭎  ⊸", command: xplr, executables: [xplr] }
      - { name: nvim,  title: "⟜   ⊸", command: nvim, executables: [nvim] }
      - { name: term,  title: "⟜   ⊸", command: "etree 1", executables: [erd, head] }
      - { name: build, title: "⟜   ⊸", command: "etree 2", executables: [erd, head] }
      - { name: git,   title: "⟜   ⊸", command: lazygit, requires: git, executables: [git, lazygit] }

  agents: # ├─ agents profile ─────────────────────────────────────────────────────┤
    order: 1
    prefix: "agents-"
    focus: build
    tabs:
      - { name: scout, title: "⊰   ⊱", executables: [opencode] }
      - { name: build, title: "⊰ 󰯉  ⊱", command: c, executables: [opencode] }
      - { name: drive, title: "⊰   ⊱", executables: [opencode] }
      - name: plan
        title: "⊰   ⊱"
        executables: [opencode]
        actions:
          build: {}
      - { name: learn, title: "⊰   ⊱", executables: [opencode] }

  agents-all: # ├─ all-agents profile ────────────────────────────────────────────────┤
    order: 1
    prefix: "agents-"
    focus: build
    tabs:
      - { name: scout, title: "⊰   ⊱", command: c, executables: [opencode] }
      - { name: build, title: "⊰ 󰯉  ⊱", command: c, executables: [opencode] }
      - { name: drive, title: "⊰   ⊱", command: c, executables: [opencode] }
      - name: plan
        title: "⊰   ⊱"
        command: c
        executables: [opencode]
        actions:
          build: {}
      - { name: learn, title: "⊰   ⊱", command: c, executables: [opencode] }

  leadpier: # ├─ leadpier profile ─────────────────────────────────────────────────┤
    order: 2
    prefix: "lp-"
    focus: frontend
    tabs:
      - name: leadpier
        title: "« 󰠳  »"
        cwd: "~/LeadPier"
        command: nvim
        executables: [nvim]
        actions:
          nvim: {}
      - name: frontend
        title: "«   »"
        command: nvim
        executables: [nvim]
        cwd: "~/LeadPier/frontend"
        actions:
          nvim: {}
      - name: services
        title: "«   »"
        command: nvim
        executables: [nvim]
        cwd: "~/LeadPier/backend/services"
        actions:
          nvim: {}
      - name: frontend-term
        title: "«   »"
        cwd: "~/LeadPier/frontend"
        actions:
          term: {}
      - name: backend-term
        title: "«   »"
        cwd: "~/LeadPier"
        actions:
          term: {}

# ╭───────────────────────────────────────────────────────────────────────────────╮
# │ background                                                                    │
# ╰───────────────────────────────────────────────────────────────────────────────╯
background:
  display: "auto"
  video: "/usr/share/backgrounds/dotfiles/dna.webm"
  socket: "/tmp/mpvpaper.sock"

# ╭───────────────────────────────────────────────────────────────────────────────╮
# │ init                                                                          │
# ╰───────────────────────────────────────────────────────────────────────────────╯
init:
  workspace: 6
  network_timeout: 10

# ╭───────────────────────────────────────────────────────────────────────────────╮
# │ bluetooth                                                                     │
# ╰───────────────────────────────────────────────────────────────────────────────╯
bluetooth:
  enabled: true
  device: "70:F9:4A:C0:E5:2E"

# ╭───────────────────────────────────────────────────────────────────────────────╮
# │ vpn                                                                           │
# ╰───────────────────────────────────────────────────────────────────────────────╯
vpn:
  connections:
    Trend:
      profile: ~/.local/share/dotfiles/vpn/work.nmconnection

# ╭───────────────────────────────────────────────────────────────────────────────╮
# │ notifications                                                                 │
# ╰───────────────────────────────────────────────────────────────────────────────╯
notify:
  default_volume: 100 # percentage; 100 = paplay 65536. Per-event volume overrides this.

  # ├─ visual styles ────────────────────────────────────────────────────────────┤
  styles:
    primary:
      background: "#49353130"
      foreground: "#f2a170"
      frame: "#ea834b"
    secondary:
      background: "#25284180"
      foreground: "#8aa4f3"
      frame: "#6380ec80"
    tertiary:
      background: "#2a2d4580"
      foreground: "#b29ae8"
      frame: "#9376d880"
    success:
      background: "#2a3d2580"
      foreground: "#95cb79"
      frame: "#73ad5a80"
    error:
      background: "#49313130"
      foreground: "#f34658"
      frame: "#ea4b53"

  # ├─ agent events ─────────────────────────────────────────────────────────────┤
  # Persistent = timeout 0. Urgency derived: critical if timeout > 0, normal otherwise.
  agent_events:
    start:
      style: secondary
      sound: civ5-worker-select
      volume: 95
      timeout: 1000
    idle:
      style: secondary
      sound: sdv-frog
      volume: 95
      timeout: 5000

    lane:
      style: success
      sound: civ6-notification
      volume: 65
      timeout: 2500

    complete:
      style: primary
      sound: jobs-done
      volume: 110

    permission:
      style: tertiary
      sound: ssb-ready
    question:
      style: tertiary
      sound: hey-listen

    error:
      style: error
      sound: something-need-doing
      timeout: 2500
      volume: 100

  # ├─ sound routing ────────────────────────────────────────────────────────────┤
  urgency_sounds: # common urgency levels
    low: none
    normal: moondrop
    critical: gems

  app_sounds: # app-specific sounds override urgency-based sounds when both match.
    timer: jackpot
    attention: discovery
    chat: reward
    work: fruit
    wf-start: discovery
    wf-end: reward
    grok bot: paprika

  # ├─ activation targets ───────────────────────────────────────────────────────┤
  # Keys match the dunst app name or desktop-entry; class is the live Hyprland class.
  # Apps listed here are focused when their notification is activated (click or Alt+C),
  # even when the sending app offers no action of its own.
  # Routes last only while the latest notification for that target remains active.
  # Repeated notifications for one target coalesce into the newest route.
  action_focus_apps:
    Slack: { workspace: 1, class: slack }
    Grok Bot: { workspace: 1, class: grok-bot }
    Firefox: { workspace: 1, class: firefox-developer-edition }
    Firefox Developer Edition: { workspace: 1, class: firefox-developer-edition }
    firefox-developer-edition: { workspace: 1, class: firefox-developer-edition }

  # ├─ silence filters ──────────────────────────────────────────────────────────┤
  silent_apps: # these suppress sounds without suppressing the notification itself.
    - Spotify
    - discord
    - slack
  kitty_silent_patterns: # these silence agent based notications, favoring agent styles instead
    - opencode
    - approval
