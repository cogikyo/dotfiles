  fallback_source: alsa_input.usb-Seeed_Studio_reSpeaker_XVF3800_4-Mic_Array_114993701262801368-00.analog-stereo
  name_mappings:
    AirPodsHiRes: AirPods Max
    alsa_output.pci-0000_c2_00.1.hdmi-stereo-extra1: LG TV
    alsa_input.usb-Seeed_Studio_reSpeaker_XVF3800_4-Mic_Array_114993701262801368-00.analog-stereo: reSpeaker
    alsa_output.usb-Seeed_Studio_reSpeaker_XVF3800_4-Mic_Array_114993701262801368-00.analog-stereo: reSpeaker
    alsa_input.usb-Focusrite_Scarlett_Solo_USB_Y70ZEU921E21FF-00.HiFi__Mic1__source: Scarlett
    alsa_output.usb-Focusrite_Scarlett_Solo_USB_Y70ZEU921E21FF-00.HiFi__Line__sink: Scarlett
    alsa_input.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__Mic1__source: XPS Mic
    alsa_output.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__Speaker__sink: XPS Speaker
