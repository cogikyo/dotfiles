[Service]
# Read-only directories, such as Go module caches, prevent tmpfiles from unlinking their contents.
# Walk the noatime source: /tmp/opencode's relatime bind would refresh directory atimes and stop them aging out.
ExecStartPre=-/usr/bin/find %h/.local/state/opencode/scratch %h/.cache/opencode-tmp -type d ! -perm -u=w -exec chmod u+w {} +
