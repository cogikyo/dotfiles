[server]
mdns_enabled = false

[http]
enabled = true
bind_to_address = 127.0.0.1
port = 1780
doc_root =

[tcp-control]
enabled = true
bind_to_address = 127.0.0.1
port = 1705

[tcp-streaming]
enabled = true
bind_to_address = 0.0.0.0
port = 1704

[stream]
source = pipewire://?name=snapcast&idle_threshold=1000
sampleformat = 48000:16:2
codec = pcm
chunk_ms = 20
# node-1 stalled at 300 and 400 ms over Wi-Fi.
buffer = 600

[streaming_client]
initial_volume = 100

[logging]
sink = stdout
filter = *:info
