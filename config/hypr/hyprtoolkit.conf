# vagari palette for hyprtoolkit 0.6 apps; keys from hyprtoolkit src/palette/ConfigManager.cpp
background = rgb(222536) # bg
# base fills both text inputs and plain buttons.
base = rgb(181b2c) # drk_1
# Resting border; hyprtoolkit draws the focused border at 1.5x per channel, here #5e68b4.
alternate_base = rgb(3f4578) # glc_3
text = rgb(aeb9f8) # fg
bright_text = rgb(bec6f8) # brt_1
link_text = rgb(9db2f4) # blu_4
accent = rgb(7492ef) # blu_2
icon_theme = Papirus-Dark

font_size = 17
small_font_size = 15
h3_size = 20
h2_size = 23
h1_size = 29
