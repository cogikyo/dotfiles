general {
    hide_cursor = true
}

background {
    monitor =
    path = /usr/share/backgrounds/dotfiles/dna-still.png
    color = rgb(222536)
}

label {
    monitor =
    text = <span weight="500">$TIME</span>
    color = rgb(7492ef)
    font_size = 120
    font_family = Archivo
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgb(131626)
    position = 0, 380
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +'%A, %B %-d'
    color = rgb(aeb9f8)
    font_size = 24
    font_family = sans-serif
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgb(131626)
    position = 0, 260
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:600000] ~/.local/bin/ewwd query weather 2>/dev/null | jq -r 'def esc: gsub("&";"&amp;") | gsub("<";"&lt;") | gsub(">";"&gt;"); select(.temp != null) | (.icon | rtrimstr(" ")) + " " + (.temp | tostring) + "° " + (.desc | esc)' 2>/dev/null
    color = rgb(7b7fb0)
    font_size = 18
    font_family = sans-serif, Symbols Nerd Font
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgb(131626)
    position = 0, 212
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 316, 40
    outline_thickness = 2
    rounding = 10
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgb(7492ef)
    inner_color = rgb(222536)
    font_color = rgb(aeb9f8)
    font_family = sans-serif
    fade_on_empty = false
    placeholder_text = <span foreground="##7690b9" size="12pt">password</span>
    hide_input = false
    check_color = rgb(76d78b)
    fail_color = rgb(f36978)
    capslock_color = rgb(f2a170)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    position = 0, 0
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:2000] ~/.local/bin/ewwd query music 2>/dev/null | jq -r 'def esc: gsub("&";"&amp;") | gsub("<";"&lt;") | gsub(">";"&gt;"); select(.playing == true) | (.title | esc) + "  ·  " + (.artist | esc)' 2>/dev/null
    color = rgb(7b7fb0)
    font_size = 18
    font_family = sans-serif
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgb(131626)
    position = 0, 120
    halign = center
    valign = bottom
}
