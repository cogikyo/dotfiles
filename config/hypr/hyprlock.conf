general {
    hide_cursor = true
}

background {
    path = screenshot
    color = rgb(222536)
    crossfade_time = 1
}

input-field {
    monitor =
    size = 100, 50
    outline_thickness = 2
    dots_size = 1
    dots_center = true
    outer_color = rgba(22253600)
    inner_color = rgba(22253650)
    font_color = rgb(7492ef)
    fade_on_empty = true
    swap_font_color = true
    placeholder_text =
    hide_input = false
    check_color = rgb(76d78b)
    fail_color = rgb(f36978)
    capslock_color = rgb(f2a170)
    position = 0, -50
    halign = center
    valign = top
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
}
