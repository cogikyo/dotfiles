general {
    lock_cmd = hyprd lock full
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch "hl.dsp.dpms({ action = 'on' })"; sleep 1; hyprctl dispatch "hl.dsp.dpms({ action = 'on' })"; sleep 2; hyprctl dispatch "hl.dsp.dpms({ action = 'on' })"
    inhibit_sleep = 3
}

listener {
    timeout = 1800  # 30 min
    on-timeout = hyprd lock full
}

listener {
    timeout = 10800  # 3 h
    on-timeout = hyprctl dispatch "hl.dsp.dpms({ action = 'off' })"
    on-resume = hyprctl dispatch "hl.dsp.dpms({ action = 'on' })"
}

