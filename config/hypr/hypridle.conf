general {
    lock_cmd = hyprd lock full
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = sh -c 'hyprctl dispatch dpms on; sleep 1; hyprctl dispatch dpms on; sleep 2; hyprctl dispatch dpms on'
    inhibit_sleep = 3
}

listener {
    timeout = 900   # 15 min
    on-timeout = hyprd lock full
}

listener {
    timeout = 960   # 16 min
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

