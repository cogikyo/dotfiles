context.properties = {
    log.level = 2
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-rt
        args = { }
        flags = [ ifexists nofail ]
    }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-echo-cancel
        args = {
            library.name   = aec/libspa-aec-webrtc
            monitor.mode   = true
            audio.rate     = 16000
            audio.channels = 2
            audio.position = [ FL FR ]
            node.latency   = 1440/48000
            capture.props = {
                node.name          = echo-cancel-capture
                target.object      = "alsa_input.usb-Seeed_Studio_reSpeaker_XVF3800_4-Mic_Array_114993701262801368-00.analog-stereo"
                node.dont-fallback = true
                node.linger        = true
            }
            source.props = {
                node.name        = echo-cancel-source
                node.description = "Echo-Cancel Source"
            }
            sink.props = {
                node.name          = echo-cancel-reference
                target.object      = "alsa_output.pci-0000_c2_00.1.hdmi-stereo-extra1"
                node.dont-fallback = true
                node.linger        = true
            }
        }
    }
]
