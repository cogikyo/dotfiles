context.properties = {
    log.level = 2
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-rt
        args = { }
        flags = [ ifexists nofail ]
    }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Cleaned AirPods"
            media.name       = "Cleaned AirPods"
            audio.rate       = 48000
            audio.channels   = 1
            audio.position   = [ MONO ]
            filter.graph = {
                nodes = [
                    {
                        type    = ladspa
                        name    = denoise
                        plugin  = /usr/lib/ladspa/librnnoise_ladspa.so
                        label   = noise_suppressor_mono
                        control = {
                            "VAD Threshold (%)"          = 0.0 # Disable the speech gate (default: 74%).
                            "VAD Grace Period (ms)"      = 0.0
                            "Retroactive VAD Grace (ms)" = 0.0
                            "Dry Mix"                    = 0.0
                        }
                    }
                    {
                        type    = builtin
                        name    = highpass
                        label   = bq_highpass
                        control = { "Freq" = 80.0 "Q" = 0.707 }
                    }
                    {
                        type    = builtin
                        name    = body
                        label   = bq_peaking
                        control = { "Freq" = 150.0 "Q" = 0.8 "Gain" = 2.5 }
                    }
                    {
                        type    = builtin
                        name    = mud
                        label   = bq_peaking
                        control = { "Freq" = 400.0 "Q" = 1.0 "Gain" = -2.0 }
                    }
                    {
                        type    = builtin
                        name    = presence
                        label   = bq_peaking
                        control = { "Freq" = 3500.0 "Q" = 0.9 "Gain" = 3.0 }
                    }
                    {
                        type   = builtin
                        name   = tone
                        # 10160 Hz, Q 30 notch for the steady mic tone; PipeWire 1.6.10 caps bq_notch Q at 10.
                        label  = bq_raw
                        config = {
                            coefficients = [
                                { rate = 48000
                                  b0 = 1.0 b1 = -0.47706692 b2 = 1.0
                                  a0 = 1.01618557 a1 = -0.47706692 a2 = 0.98381443 }
                            ]
                        }
                    }
                ]
                links = [
                    { output = "denoise:Output" input = "highpass:In" }
                    { output = "highpass:Out"   input = "body:In" }
                    { output = "body:Out"       input = "mud:In" }
                    { output = "mud:Out"        input = "presence:In" }
                    { output = "presence:Out"   input = "tone:In" }
                ]
            }
            capture.props = {
                node.name          = airpods-voice-capture
                target.object      = AirPodsHiRes
                node.dont-fallback = true
                node.linger        = true # Keep capture alive across AirPods disconnects.
                node.passive       = true # Idle when unused, unless another client holds AirPodsHiRes (PipeWire 1.6.10).
            }
            playback.props = {
                node.name        = AirPodsVoice
                node.description = "Cleaned AirPods"
                media.class      = Audio/Source
            }
        }
    }
]
