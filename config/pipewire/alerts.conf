context.properties = {
    log.level = 2
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-rt
        args = { }
        flags = [ ifexists nofail ]
    }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-loopback
        args = {
            node.description = "Alerts"
            capture.props = {
                node.name             = alerts
                node.description      = "Alerts"
                media.class           = Audio/Sink
                priority.session      = 0
                device.intended-roles = [ event Event EVENT notification Notification NOTIFICATION alert Alert ALERT ]
                cogikyo.duck          = skip
            }
            playback.props = {
                node.name          = alerts-output
                node.description   = "Alerts output"
                target.object      = "alsa_output.pci-0000_c2_00.1.hdmi-stereo-extra1"
                node.dont-fallback = true
                node.linger        = true
                cogikyo.duck       = skip
            }
        }
    }
]
