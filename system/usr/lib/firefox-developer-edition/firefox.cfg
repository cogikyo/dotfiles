// Disable Ctrl+U (View Source) shortcut and mouse dragging of tabs and tab groups
try {
  Services.obs.addObserver(
    {
      observe(win) {
        win.addEventListener(
          "DOMContentLoaded",
          () => {
            let doc = win.document;
            doc.getElementById("key_viewSource")?.remove();
            doc.getElementById("tabbrowser-tabs")?.addEventListener(
              "dragstart",
              event => {
                event.preventDefault();
                event.stopPropagation();
              },
              true
            );

            if (!doc.getElementById("key_selectTab1")) {
              return;
            }
            for (let n = 1; n <= 8; n++) {
              doc.getElementById(`key_selectTab${n}`).remove();
            }
            win.addEventListener(
              "keydown",
              event => {
                let n = /^Digit([1-8])$/.exec(event.code)?.[1];
                if (!n || !event.altKey || event.ctrlKey || event.metaKey) {
                  return;
                }
                event.preventDefault();
                event.stopPropagation();

                let gBrowser = win.gBrowser;
                let items = gBrowser.tabContainer.ariaFocusableItems;
                if (event.shiftKey) {
                  let group = items.filter(item =>
                    gBrowser.isTabGroupLabel(item)
                  )[n - 1]?.group;
                  if (group) {
                    group.collapsed = !group.collapsed;
                  }
                  return;
                }
                let tab = items.filter(
                  item => gBrowser.isTab(item) && !item.group?.collapsed
                )[n - 1];
                if (tab) {
                  gBrowser.selectedTab = tab;
                }
              },
              true
            );
          },
          { once: true }
        );
      },
    },
    "domwindowopened"
  );
} catch (e) {}
