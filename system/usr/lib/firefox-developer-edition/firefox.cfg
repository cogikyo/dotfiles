// Disable Ctrl+U (View Source) shortcut and mouse dragging of tabs and tab groups
try {
  Services.obs.addObserver(
    {
      observe(win) {
        win.addEventListener(
          "DOMContentLoaded",
          () => {
            let doc = win.document;
            doc.getElementById("key_viewSource")?.remove();
            doc.getElementById("tabbrowser-tabs")?.addEventListener(
              "dragstart",
              event => {
                event.preventDefault();
                event.stopPropagation();
              },
              true
            );

            if (!doc.getElementById("key_selectTab1")) {
              return;
            }
            for (let n = 1; n <= 8; n++) {
              doc.getElementById(`key_selectTab${n}`).remove();
            }
            win.addEventListener(
              "keydown",
              event => {
                let n = /^Digit([1-8])$/.exec(event.code)?.[1];
                if (!n || !event.altKey || event.ctrlKey || event.metaKey) {
                  return;
                }
                event.preventDefault();
                event.stopPropagation();

                let { gBrowser, Tabbrowser } = win;
                let items = gBrowser.tabContainer.ariaFocusableItems;
                if (event.shiftKey) {
                  let group = items.filter(item =>
                    Tabbrowser.isTabGroupLabel(item)
                  )[n - 1]?.group;
                  if (group) {
                    group.collapsed = !group.collapsed;
                  }
                  return;
                }
                let tab = items.filter(
                  item => Tabbrowser.isTab(item) && !item.group?.collapsed
                )[n - 1];
                if (tab) {
                  gBrowser.selectedTab = tab;
                }
              },
              true
            );
          },
          { once: true }
        );
      },
    },
    "domwindowopened"
  );
} catch (e) {}

try {
  const bitwarden = "{446900e4-71c2-419f-a6a7-df9c091e268b}";
  const shortcuts = {
    [bitwarden]: {
      _execute_browser_action: "Ctrl+1",
      _execute_sidebar_action: "Ctrl+2",
      autofill_card: "Ctrl+3",
      autofill_login: "Ctrl+4",
      generate_password: "Ctrl+5",
    },
  };

  async function applyShortcuts(extension) {
    let wanted = shortcuts[extension?.id];
    if (!wanted || !extension.shortcuts) {
      return;
    }
    let current = new Map(
      (await extension.shortcuts.allCommands()).map(c => [c.name, c.shortcut])
    );
    for (let [name, shortcut] of Object.entries(wanted)) {
      if (current.get(name) !== shortcut) {
        await extension.shortcuts.updateCommand({ name, shortcut });
      }
    }
  }

  function run(extension) {
    applyShortcuts(extension).catch(e =>
      Services.console.logStringMessage(`firefox.cfg shortcuts: ${e}`)
    );
  }

  Services.obs.addObserver(function init() {
    Services.obs.removeObserver(init, "browser-delayed-startup-finished");
    let { ExtensionParent } = ChromeUtils.importESModule(
      "resource://gre/modules/ExtensionParent.sys.mjs"
    );
    ExtensionParent.apiManager.on("ready", (_, extension) => run(extension));
    for (let id of Object.keys(shortcuts)) {
      let extension = ExtensionParent.GlobalManager.getExtension(id);
      if (extension?.state === "Startup: Complete") {
        run(extension);
      }
    }
  }, "browser-delayed-startup-finished");
} catch (e) {}
