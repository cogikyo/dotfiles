// Disable Ctrl+U (View Source) shortcut and mouse dragging of tabs and tab groups
try {
  Services.obs.addObserver(
    {
      observe(win) {
        win.addEventListener(
          "DOMContentLoaded",
          () => {
            let doc = win.document;
            doc.getElementById("key_viewSource")?.remove();
            doc.getElementById("tabbrowser-tabs")?.addEventListener(
              "dragstart",
              event => {
                event.preventDefault();
                event.stopPropagation();
              },
              true
            );
          },
          { once: true }
        );
      },
    },
    "domwindowopened"
  );
} catch (e) {}
