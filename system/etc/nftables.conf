#!/usr/sbin/nft -f

destroy table inet dotfiles_filter

table inet dotfiles_filter {
    chain input {
        type filter hook input priority filter; policy accept;

        iifname "lo" tcp dport 22 accept
        iifname "tailscale0" tcp dport 22 accept
        tcp dport 22 drop

        iifname "lo" tcp dport 3493 accept
        ip saddr { 192.168.0.105, 192.168.0.106, 192.168.0.111, 192.168.0.118 } tcp dport 3493 accept
        tcp dport 3493 drop
    }
}
