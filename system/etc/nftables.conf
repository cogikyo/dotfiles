#!/usr/sbin/nft -f

destroy table inet dotfiles_filter

table inet dotfiles_filter {
    chain input {
        type filter hook input priority filter; policy drop;

        ct state established,related accept
        ct state invalid drop
        iifname "lo" accept

        meta l4proto icmp accept
        meta l4proto ipv6-icmp accept

        iifname "tailscale0" accept
        udp dport 41641 accept

        # Host-local input rules are installed by their owners, not this overlay.
        include "/etc/nftables.d/*.nft"

        ip saddr 192.168.0.0/24 udp dport 5353 accept
        ip6 saddr fe80::/10 udp dport 5353 accept

        limit rate 10/minute log prefix "dotfiles_filter drop: "
    }
}
