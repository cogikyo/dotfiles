Host edge agent-edge
    HostName 192.168.0.118
    HostKeyAlias edge

Host apps agent-apps
    HostName 192.168.0.105
    HostKeyAlias apps

Host analytics agent-analytics
    HostName 192.168.0.106
    HostKeyAlias analytics

Host edge apps analytics
    User cullyn
    IdentityFile ~/.ssh/cogikyo
    IdentityFile ~/.ssh/admin
    IdentitiesOnly yes

Host agent-edge agent-apps agent-analytics
    User agent
    IdentityFile ~/.ssh/agent
    IdentitiesOnly yes

Host credential-apps
    HostName 192.168.0.105
    HostKeyAlias apps
    User credential
    IdentityFile ~/.ssh/credential
    IdentitiesOnly yes

Host analytics-initrd
    HostName 192.168.0.106
    Port 2222
    HostKeyAlias analytics-initrd
    User root
    IdentityFile ~/.ssh/cogikyo
    IdentityFile ~/.ssh/admin
    IdentitiesOnly yes
    RequestTTY yes

Host apps-initrd
    HostName 192.168.0.105
    Port 2222
    HostKeyAlias apps-initrd
    User root
    IdentityFile ~/.ssh/cogikyo
    IdentityFile ~/.ssh/admin
    IdentitiesOnly yes
    RequestTTY yes
