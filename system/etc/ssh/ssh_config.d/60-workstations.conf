Match host costello,costello-tunnel exec "ip -4 -o addr show to 192.168.0.0/24 | grep -q . && nc -z -w 1 192.168.0.128 22 2>/dev/null"
    HostName 192.168.0.128
    ProxyCommand none

Host costello costello-tunnel
    HostName ssh.cullyn.dev
    ProxyCommand cloudflared access ssh --hostname %h
    HostKeyAlias costello
    IdentitiesOnly yes

# Keep identities separate: IdentityFile entries accumulate across matching blocks.
Host costello
    User cullyn
    IdentityFile ~/.ssh/cogikyo

Host costello-tunnel
    User tunnel
    IdentityFile ~/.ssh/tunnel
    RemoteForward 2201 localhost:22
    ExitOnForwardFailure yes
    ServerAliveInterval 30
    ServerAliveCountMax 3
    BatchMode yes

Host abbott
    HostName localhost
    Port 2201
    HostKeyAlias abbott
    User cullyn
    IdentityFile ~/.ssh/cogikyo
    IdentitiesOnly yes
